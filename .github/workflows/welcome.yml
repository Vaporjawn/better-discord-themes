name: Welcome new contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            Thanks for opening your first issue! A maintainer will look at it soon.
            If you are reporting a broken theme, a screenshot and your BetterDiscord
            version help a lot. See CONTRIBUTING.md for how to send a fix yourself.
          pr-message: >
            Thanks for your first pull request! The "Validate themes" check will run
            automatically. If it fails, the log says which theme is missing which field.
            See CONTRIBUTING.md for the checklist.
